<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>การใช้คำสั่ง "&lt;PRE&gt;...&lt;/PRE&gt;"</title>
</head>
<body>
    <pre>
        "เร็วก็หาว่าล้ำหน้า
        พอช้าก็หาว่าอืดอาด
        โง่ก็ถูกตะวาด
        พอฉลาดก็ถูกระแวง
        ทำก่อนบอกไม่ได้สั่ง
        ครั้นพอทำทีหลังบอกไม่รู้จักคิด
        คนดี ดี ถูกถีบไปไกลตัว
        แต่กลับเอาคนชั่วมาใกล้ชิด"
    </pre>
</body>
</html>
