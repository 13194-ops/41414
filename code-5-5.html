<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>การแสดงรายการโดยใช้ตัวเลขเรียงลำดับ</title>
</head>
<body>
    <ol type="i" start="2"><b>เลือกให้เป็น</b>
        <li>ถึงยามได้ ได้ให้ดี ไม่มีทุกข์</li>
        <li>ถึงยามเป็น เป็นให้ถูก ตามวิถี</li>
        <li>ถึงยามตาย ตายอย่างเป็น เห็นสุขดี</li>
        <li>ได้อย่างนี้ ไม่มีทุกข์ ทุกเวลา</li>
    </ol>
</body>
</html>
